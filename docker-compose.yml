version: "3.8"

services:
  ai-chat:
    build: .
    image: ai-chat:latest
    container_name: ai-chat
    ports:
      - "${PORT:-8080}:80"
    environment:
      - IDLE_TIMEOUT_MIN=${IDLE_TIMEOUT_MIN:-15}
    volumes:
      - ai-chat-data:/data
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "1"

volumes:
  ai-chat-data:
