<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>水鱼 Chat - 用户管理</title>
<link rel="icon" href="icon.ico">
<link rel="stylesheet" href="style.css">
<style>
  .usr-page { display:flex; height:100vh; background:var(--bg); }
  .usr-sidebar { width:200px; flex-shrink:0; background:var(--bg2); border-right:1px solid var(--border); display:flex; flex-direction:column; }
  .usr-sidebar-header { padding:16px; font-size:16px; font-weight:600; color:var(--text); border-bottom:1px solid var(--border); display:flex; align-items:center; gap:8px; }
  .usr-sidebar-header svg { color:var(--brand); }
  .usr-sidebar-footer { padding:12px; border-top:1px solid var(--border); margin-top:auto; }
  .usr-main { flex:1; overflow-y:auto; padding:24px; max-width:600px; }
  .usr-title { font-size:18px; font-weight:600; color:var(--text); margin-bottom:20px; }
  .usr-item { display:flex; align-items:center; justify-content:space-between; padding:12px 16px; border:1px solid var(--border); border-radius:8px; margin-bottom:8px; background:var(--dialog-bg); }
  .usr-info .usr-name { font-size:14px; font-weight:500; color:var(--text); }
  .usr-info .usr-meta { font-size:12px; color:var(--text3); margin-top:2px; }
  .usr-badge { font-size:11px; padding:2px 8px; border-radius:10px; }
  .usr-badge.admin { background:#eef2ff; color:var(--brand); }
  .usr-badge.user { background:var(--bg2); color:var(--text3); }
  .usr-add { display:none; padding:16px; border:1px solid var(--border); border-radius:8px; margin-bottom:8px; background:var(--dialog-bg); }
  .usr-add input { width:100%; padding:8px 10px; border:1px solid var(--input-border); border-radius:6px; background:var(--input-bg); color:var(--text); font-size:13px; margin-bottom:8px; box-sizing:border-box; }
  .usr-add input:focus { outline:none; border-color:var(--brand); }
  .usr-add-actions { display:flex; gap:8px; }
  .btn-sm { padding:6px 14px; font-size:12px; border-radius:6px; cursor:pointer; border:1px solid var(--border); background:var(--bg2); color:var(--text); }
  .btn-sm.primary { background:var(--brand); color:#fff; border-color:var(--brand); }
  .btn-sm.primary:hover { background:var(--brand-hover); }
  .btn-sm.danger { background:var(--danger-bg); color:var(--danger-text); border-color:transparent; }
  .btn-sm.danger:hover { opacity:.85; }
  .btn-sm:disabled { opacity:.4; cursor:not-allowed; }
  .btn-add-block { width:100%; padding:10px; border:1px dashed var(--border); border-radius:8px; background:transparent; color:var(--text2); font-size:13px; cursor:pointer; margin-top:4px; }
  .btn-add-block:hover { border-color:var(--brand); color:var(--brand); background:rgba(99,102,241,.04); }
  .usr-empty { text-align:center; padding:40px 0; color:var(--text3); font-size:14px; }
  .usr-loading { text-align:center; padding:40px 0; color:var(--text3); font-size:13px; }
  .usr-error { padding:12px; background:var(--danger-bg); color:var(--danger-text); border-radius:6px; font-size:13px; }
</style>
</head>
<body>
<div class="usr-page">
  <aside class="usr-sidebar">
    <div class="usr-sidebar-header">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      用户管理
    </div>
    <div class="usr-sidebar-footer">
      <a href="index.html" style="display:flex;align-items:center;gap:6px;color:var(--text2);text-decoration:none;font-size:13px;padding:8px 12px;border-radius:6px;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
        返回聊天
      </a>
    </div>
  </aside>

  <main class="usr-main">
    <div class="usr-title">用户列表</div>
    <div id="user-list"><div class="usr-loading">加载中...</div></div>
    <div class="usr-add" id="user-add-form">
      <input type="text" id="new-username" placeholder="用户名">
      <input type="password" id="new-user-password" placeholder="密码（至少4位）">
      <div class="usr-add-actions">
        <button class="btn-sm primary" id="btn-add-user-confirm">确认添加</button>
        <button class="btn-sm" id="btn-add-user-cancel">取消</button>
      </div>
    </div>
    <button class="btn-add-block" id="btn-add-user">+ 添加用户</button>
  </main>
</div>

<script src="app.js"></script>
</body>
</html>
